<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <meta name="theme-color" content="#051023">
    
    <!-- Icons & favicons -->
      <!-- For iPhone 6 Plus -->
      <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>/favicons/180.png">
      <!-- For iPad retina touch icon -->
      <link rel="apple-touch-icon" sizes="167x167" href="<%= BASE_URL %>/favicons/167.png">
      <!-- For iPad touch icon -->
      <link rel="apple-touch-icon" sizes="152x152" href="<%= BASE_URL %>/favicons/152.png">
      <!-- For iPhone retina touch icon -->
      <link rel="apple-touch-icon" sizes="120x120" href="<%= BASE_URL %>/favicons/120.png">
      <!-- For iPad home screen -->
      <link rel="apple-touch-icon" sizes="76x76" href="<%= BASE_URL %>/favicons/76.png">
      
      <link rel="shortcut icon" sizes="57x57" href="<%= BASE_URL %>/favicons/57.png">
      
      <!-- For most desktop browsers -->
      <link rel="shortcut icon" href="<%= BASE_URL %>/favicons/32.png">
    <!-- .Icons & favicons -->

    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
